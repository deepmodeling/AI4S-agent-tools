[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comp_dart"
version = "0.1.0"
description = "Deep Potential Agent for atomistic simulation"
readme = "README.md"
# [修正] 你的 Docker 环境是 Python 3.10，必须放宽限制
requires-python = ">=3.10"

dependencies = [
    "tqdm",
    "requests>=2.32.3",
    "flask>=3.1.1",
    "scipy>=1.12.0",
    "ase>=3.22.1",
    "seekpath>=2.0.1",
    # [优化] Dockerfile 已处理核心库，此处仅列出名称作为依赖检查
    # 不要在这里写版本号，防止覆盖 Dockerfile 中精心准备的版本 (如 torch 2.7.0, numpy 1.26.4)
    "torch",
    "torchvision",
    "torchaudio",
    # "deepmd-kit",  <-- [删除] 绝对不要写这个，否则会覆盖你的源码编译版
    "numpy",
    "dpdata>=0.2.25",
    "phonopy",
    "pymatgen",
    "spglib",
    "matplotlib",
    "typing-extensions",
    "pyyaml",
    "bohr-agent-sdk>=0.1.101",
    "jsonpickle>=4.1.1",
    # [建议删除] 以下两个包已在 Dockerfile 中通过 Git 安装。
    # 如果必须保留，请确保 Docker 安装的版本满足此处要求，否则 pip install . 时会重新下载。
    # "dpdispatcher", 
    # "bohrium-sdk"
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "black>=21.0.0",
    "flake8>=3.9.0",
]
docs = [
    "sphinx>=4.0.0",
]

[project.scripts]
comp-dart = "comp_dart.server:main"

[tool.setuptools.packages.find]
include = ["comp_dart*", "comp_dart.*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.cif", "*.pt", "*.pth"]
"comp_dart" = ["../constant/*.json", "../struct_template/*"]