[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comp_dart"
version = "0.1.0"
description = "Deep Potential Agent for atomistic simulation"
readme = "README.md"
# [修正1] 必须放宽，适配 Docker 的 Python 3.10
requires-python = ">=3.10"

dependencies = [
    "tqdm",
    "requests>=2.32.3",
    "flask>=3.1.1",
    "scipy>=1.12.0",
    "ase>=3.22.1",
    "seekpath>=2.0.1",
    "torchaudio",
    "torchvision",
    "torch==2.7.0",
    # [修正2] Docker 里已有 DeepMD，本地 uv 需要时才取消注释并加 git+
    # 建议在 Docker 构建时注释掉这行，或者使用 uv 的 overrides 功能
    # "deepmd-kit @ git+https://github.com/iProzd/deepmd-kit.git@4cc677d6adf4fa1fd6202fbc6008bbd6bd0fe21f",
    "numpy==1.26.4",
    "dpdata==0.2.25",
    "phonopy",
    "pymatgen",
    "spglib",
    "matplotlib",
    "typing-extensions",
    "pyyaml",
    "bohr-agent-sdk>=0.1.101",
    "jsonpickle>=4.1.1",
    # [修正3] 修正 URL 格式 (加上 git+)
    "dpdispatcher @ git+https://github.com/zjgemi/dpdispatcher.git@sandbox",
    "bohrium-sdk @ git+https://github.com/zjgemi/bohrium-openapi-python-sdk.git@sandbox-env"
]
# ... 其他保持不变